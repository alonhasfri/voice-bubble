name: Build Voice Bubble
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
      - name: Download sherpa-onnx (Live engine)
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 4 -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar
      - name: Make the fast Turbo model (only once; kept in the "models" release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view models --json assets -q '.assets[].name' 2>/dev/null | grep -qx ggml-distil-small.en-q8_0.bin; then
            echo "Already made."; exit 0
          fi
          git clone -q --depth 1 -b v1.7.6 https://github.com/ggml-org/whisper.cpp /tmp/wcpp
          cmake -S /tmp/wcpp -B /tmp/wcpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF > /dev/null
          cmake --build /tmp/wcpp/build --target quantize -j 4 > /dev/null || cmake --build /tmp/wcpp/build --target whisper-quantize -j 4 > /dev/null
          Q=$(ls /tmp/wcpp/build/bin/ | grep quantize | head -1)
          curl -fsSL --retry 4 -o /tmp/distil.bin https://huggingface.co/distil-whisper/distil-small.en/resolve/main/ggml-distil-small.en.bin
          "/tmp/wcpp/build/bin/$Q" /tmp/distil.bin /tmp/ggml-distil-small.en-q8_0.bin q8_0
          ls -l /tmp/ggml-distil-small.en-q8_0.bin
          gh release view models >/dev/null 2>&1 || gh release create models \
            --title "Speech models" --notes "Speech models made for Voice Bubble; the app downloads them." \
            --prerelease --latest=false
          gh release upload models /tmp/ggml-distil-small.en-q8_0.bin --clobber
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Restore signing key
        id: key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > app/voice.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing key restored."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIGNING_KEYSTORE_B64 secret: building, but NOT publishing (it couldn't install over your app)."
          fi
      - name: Version
        # Build numbers carry on from where Voice Bubble's old home (combo-checker) stopped, so phones see an update.
        run: echo "CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
      - name: Build
        env:
          VERSION_CODE: ${{ env.CODE }}
          VERSION_NAME: voice-${{ env.CODE }}
        run: gradle testBasicReleaseUnitTest assembleBasicRelease assembleAutotypeRelease --no-daemon
      - name: Keep the APKs for the release
        if: steps.key.outputs.signed == 'true'
        run: |
          cp app/build/outputs/apk/basic/release/app-basic-release.apk voice-bubble.apk
          cp app/build/outputs/apk/autotype/release/app-autotype-release.apk voice-bubble-autotype.apk
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: apks
          path: |
            voice-bubble.apk
            voice-bubble-autotype.apk

  # Voice Bubble for Windows: the same code as the phone app (text tools, characters, AI, dictionary…) with a
  # Windows bubble, keyboard shortcut and typing. Added to the same release as the APKs.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Version
        shell: bash
        run: echo "CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
      - name: Speech engine (whisper.cpp as a Windows library)
        shell: bash
        run: |
          cmake -S desktop/native -B nb -A x64 > /dev/null
          cmake --build nb --config Release -j 4 > nb.log 2>&1 || { tail -60 nb.log; exit 1; }
          ls -l nb/Release/voicebubble_base.dll
      - name: Build the app
        shell: bash
        env:
          VERSION_CODE: ${{ env.CODE }}
        run: gradle -p desktop installDist --no-daemon
      - name: Package (no Java needed on the PC)
        shell: bash
        run: |
          jpackage --type app-image --name "Voice Bubble" --dest out \
            --input desktop/build/install/VoiceBubble/lib --main-jar VoiceBubbleDesktop.jar \
            --main-class com.voicebubble.desktop.MainKt --icon desktop/icon.ico \
            --app-version "1.0.$CODE" --vendor "Voice Bubble" \
            --add-modules java.se,jdk.crypto.ec,jdk.unsupported,jdk.charsets,jdk.zipfs,jdk.accessibility,jdk.localedata \
            --java-options '-Djava.library.path=$APPDIR' --java-options '-Dsun.java2d.uiScale.enabled=true'
          cp nb/Release/voicebubble_base.dll "out/Voice Bubble/app/"
          printf 'Voice Bubble for Windows\r\n\r\n1. Double-click "Voice Bubble.exe".\r\n   If Windows says "Windows protected your PC": More info, then Run anyway.\r\n2. Download a speech model in the window that opens (Turbo fast is a good start).\r\n3. Click where you want to type, press Ctrl+Shift+Space (or click the bubble), talk, press it again.\r\n' > "out/Voice Bubble/READ ME.txt"
          cd out && 7z a -tzip ../VoiceBubble-Windows.zip "Voice Bubble" > /dev/null && cd ..
          ls -l VoiceBubble-Windows.zip
      - name: Installer (optional)
        continue-on-error: true
        shell: bash
        run: |
          jpackage --type exe --app-image "out/Voice Bubble" --name "Voice Bubble" --dest inst \
            --app-version "1.0.$CODE" --vendor "Voice Bubble" \
            --win-per-user-install --win-shortcut --win-menu --win-dir-chooser \
            --win-upgrade-uuid 5f0c6a3e-7d1b-4d7e-9a51-3c2b8e6f9a10
          cp inst/*.exe VoiceBubble-Setup.exe
          ls -l VoiceBubble-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            VoiceBubble-Windows.zip
            VoiceBubble-Setup.exe
          if-no-files-found: warn

  # One release with everything, marked Latest (phones and PCs look for updates there).
  # Only when the APKs were built and signed; the Windows files are added when they built.
  publish:
    needs: [build, windows]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f dl/apks/voice-bubble-autotype.apk ]; then echo "::warning::Not signed: nothing published"; exit 0; fi
          CODE=$(( ${{ github.run_number }} + 100 ))
          files="dl/apks/voice-bubble.apk dl/apks/voice-bubble-autotype.apk"
          for f in dl/windows/VoiceBubble-Windows.zip dl/windows/VoiceBubble-Setup.exe; do [ -f "$f" ] && files="$files $f"; done
          # Marked "latest", so these links always give the newest:
          # https://github.com/alonhasfri/voice-bubble/releases/latest/download/voice-bubble-autotype.apk
          # https://github.com/alonhasfri/voice-bubble/releases/latest/download/VoiceBubble-Setup.exe
          gh release create "voice-bubble-$CODE" $files \
            --target "${{ github.sha }}" \
            --title "Voice Bubble build $CODE" \
            --notes "Voice Bubble: floating microphone, on-device speech to text. Phone: tap voice-bubble-autotype.apk to install (types for you; Play Protect may warn). voice-bubble.apk copies the text instead. Windows: VoiceBubble-Setup.exe installs it (or unzip VoiceBubble-Windows.zip and run Voice Bubble.exe)." \
            --latest
