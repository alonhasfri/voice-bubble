name: Build Voice Bubble
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
      - name: Download sherpa-onnx (Live engine)
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 4 -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar
      - name: Make the fast Turbo model (only once; kept in the "models" release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view models --json assets -q '.assets[].name' 2>/dev/null | grep -qx ggml-distil-small.en-q8_0.bin; then
            echo "Already made."; exit 0
          fi
          git clone -q --depth 1 -b v1.7.6 https://github.com/ggml-org/whisper.cpp /tmp/wcpp
          cmake -S /tmp/wcpp -B /tmp/wcpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF > /dev/null
          cmake --build /tmp/wcpp/build --target quantize -j 4 > /dev/null || cmake --build /tmp/wcpp/build --target whisper-quantize -j 4 > /dev/null
          Q=$(ls /tmp/wcpp/build/bin/ | grep quantize | head -1)
          curl -fsSL --retry 4 -o /tmp/distil.bin https://huggingface.co/distil-whisper/distil-small.en/resolve/main/ggml-distil-small.en.bin
          "/tmp/wcpp/build/bin/$Q" /tmp/distil.bin /tmp/ggml-distil-small.en-q8_0.bin q8_0
          ls -l /tmp/ggml-distil-small.en-q8_0.bin
          gh release view models >/dev/null 2>&1 || gh release create models \
            --title "Speech models" --notes "Speech models made for Voice Bubble; the app downloads them." \
            --prerelease --latest=false
          gh release upload models /tmp/ggml-distil-small.en-q8_0.bin --clobber
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Restore signing key
        id: key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > app/voice.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing key restored."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIGNING_KEYSTORE_B64 secret: building, but NOT publishing (it couldn't install over your app)."
          fi
      - name: Version
        # Build numbers carry on from where Voice Bubble's old home (combo-checker) stopped, so phones see an update.
        run: echo "CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
      - name: Build
        env:
          VERSION_CODE: ${{ env.CODE }}
          VERSION_NAME: voice-${{ env.CODE }}
        run: gradle testBasicDebugUnitTest assembleBasicDebug assembleAutotypeDebug --no-daemon
      - name: Publish
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/basic/debug/app-basic-debug.apk voice-bubble.apk
          cp app/build/outputs/apk/autotype/debug/app-autotype-debug.apk voice-bubble-autotype.apk
          # Marked "latest", so this link always gives the newest:
          # https://github.com/alonhasfri/voice-bubble/releases/latest/download/voice-bubble-autotype.apk
          gh release create "voice-bubble-$CODE" voice-bubble.apk voice-bubble-autotype.apk \
            --target "${{ github.sha }}" \
            --title "Voice Bubble build $CODE" \
            --notes "Voice Bubble: floating microphone, on-device speech to text. On your phone, tap voice-bubble-autotype.apk to install (types for you; Play Protect may warn). voice-bubble.apk copies the text instead and installs with no warning." \
            --latest
